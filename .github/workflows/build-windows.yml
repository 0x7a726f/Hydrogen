name: Build Windows x64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (MSVC Static Runtime)
        run: |
          cmake -S cpp_suite -B cpp_suite/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build Release Binaries & Tests
        run: |
          cmake --build cpp_suite/build --config Release --parallel

      - name: Run CTest Suite
        run: |
          ctest --test-dir cpp_suite/build -C Release --output-on-failure

      - name: Package Windows Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item cpp_suite/bin/radio_suite.exe dist/
          Copy-Item cpp_suite/bin/radio_suite_cli.exe dist/
          Copy-Item cpp_suite/bin/rtlsdr.dll dist/
          Copy-Item cpp_suite/bin/libusb-1.0.dll dist/

      - name: Upload Windows x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadioSuite-Windows-x64
          path: dist/
          if-no-files-found: error
